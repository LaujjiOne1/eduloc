services:
  db:
    # PostGIS + pgvector (recherche sémantique) : docker/db/Dockerfile. Même base Alpine PG16 : le volume pgdata reste valide.
    build: ./docker/db
    image: eduloc-db:pg16-postgis3.4-pgvector0.8.0
    container_name: eduloc-db
    environment:
      POSTGRES_USER: eduloc
      POSTGRES_PASSWORD: eduloc
      POSTGRES_DB: eduloc
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduloc -d eduloc"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: eduloc-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@eduloc.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - ./config/pgadmin-servers.json:/pgadmin4/servers.json:ro
      - pgadmindata:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: eduloc-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  centrifugo:
    image: centrifugo/centrifugo:v6
    container_name: eduloc-centrifugo
    command: ["centrifugo", "-c", "/etc/centrifugo/config.json"]
    volumes:
      - ./config/centrifugo.json:/etc/centrifugo/config.json:ro
    # Centrifugo v6 ne lit QUE ses propres noms de variables (CENTRIFUGO_HTTP_API_KEY, ...) :
    # les valeurs viennent du .env pour rester identiques à celles de l'API.
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_SECRET:-centrifugo-connection-secret}
      CENTRIFUGO_CLIENT_SUBSCRIPTION_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_SUB_SECRET:-centrifugo-subscription-secret}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:-centrifugo-api-key}
    ports:
      - "8000:8000"
    depends_on:
      - redis

  livekit:
    image: livekit/livekit-server:latest
    container_name: eduloc-livekit
    command: |
      --dev
      --bind 0.0.0.0
      --keys "devkey: secretsecretsecretsecretsecretsecret"
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
      - "50000-50100:50000-50100/udp"

  api:
    build: .
    container_name: eduloc-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://eduloc:eduloc@db:5432/eduloc?schema=public
      DIRECT_URL: postgresql://eduloc:eduloc@db:5432/eduloc?schema=public
      REDIS_URL: redis://redis:6379
      CENTRIFUGO_URL: http://centrifugo:8000
      LIVEKIT_URL: ws://livekit:7880
      # Ollama : nom du service sur le réseau privé « eduloc » (jamais une URL publique).
      OLLAMA_URL: http://ollama:11434
      # Ancien modèle (EmbeddingGemma 1) : # EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma:300m}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-hf.co/unsloth/embeddinggemma-2-GGUF:UD-Q4_K_XL}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      # Import de CV : OCR PaddleOCR et modèle de génération Ollama (extraction structurée).
      PADDLEOCR_URL: http://paddleocr:5000
      CV_EXTRACTION_MODEL: ${CV_EXTRACTION_MODEL:-qwen2.5:3b}
    ports:
      - "3000:3000"
    networks: [default, eduloc]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      centrifugo:
        condition: service_started
      livekit:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
      paddleocr:
        condition: service_healthy

  # --- Embeddings du matching sémantique (spec §14) -------------------------------------------------------------
  # Pas de « ports » : Ollama n'a aucune authentification, il n'est joignable que par l'API via le réseau « eduloc ».
  ollama:
    # Version épinglée, jamais « latest » : à faire évoluer volontairement (elle doit supporter le modèle ci-dessous).
    # 0.40.3 (stable) ne sait pas charger embeddinggemma-2 (« unknown model architecture: gemma-embedding2 ») ;
    # le support arrive avec la 0.40.4 (ici en release candidate) : # image: ollama/ollama:${OLLAMA_VERSION:-0.40.3}
    image: ollama/ollama:${OLLAMA_VERSION:-0.40.4-rc1}
    container_name: eduloc-ollama
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "-1"           # garde le modèle en mémoire : pas de latence de rechargement
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 5g                    # embeddings (~1 Go) + modèle d'extraction de CV qwen2.5:3b (~2,5 Go) ; à ajuster après mesure
    restart: unless-stopped
    networks: [eduloc]

  # Tâche ponctuelle : « pull » (pas « run ») du modèle texte, idempotente si le modèle est déjà là.
  ollama-init:
    # 0.40.3 (stable) ne sait pas charger embeddinggemma-2 (« unknown model architecture: gemma-embedding2 ») ;
    # le support arrive avec la 0.40.4 (ici en release candidate) : # image: ollama/ollama:${OLLAMA_VERSION:-0.40.3}
    image: ollama/ollama:${OLLAMA_VERSION:-0.40.4-rc1}
    container_name: eduloc-ollama-init
    environment:
      OLLAMA_HOST: http://ollama:11434  # le CLI pilote le serveur du service « ollama »
    # Ancien modèle : # entrypoint: ["ollama", "pull", "${EMBEDDING_MODEL:-embeddinggemma:300m}"]
    entrypoint: ["ollama", "pull", "${EMBEDDING_MODEL:-hf.co/unsloth/embeddinggemma-2-GGUF:UD-Q4_K_XL}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    networks: [eduloc]

  # Modèle de GÉNÉRATION pour l'import de CV (JSON structuré) : un second « pull », car ollama-init n'en tire qu'un.
  ollama-init-cv:
    image: ollama/ollama:${OLLAMA_VERSION:-0.40.4-rc1}
    container_name: eduloc-ollama-init-cv
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${CV_EXTRACTION_MODEL:-qwen2.5:3b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    networks: [eduloc]

  # --- OCR des CV et justificatifs (PaddleOCR, CPU) ---------------------------------------------------------------
  # Interne : pas de « ports » en production (voir docker-compose.dev.yml pour tester avec curl).
  paddleocr:
    build: ./docker/paddleocr
    image: eduloc-paddleocr:2.7-cpu
    container_name: eduloc-paddleocr
    volumes:
      - paddleocr_models:/models
    deploy:
      resources:
        limits:
          memory: 3g
    restart: unless-stopped
    networks: [eduloc]

volumes:
  pgdata:
  pgadmindata:
  redisdata:
  ollama_models:
  paddleocr_models:

networks:
  eduloc:
    driver: bridge
